<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashable Notecard Study</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" type="module" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Pacifico&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <img src="images/logo.png" alt="Flashable logo">
            <div class="links">
                <a href="index.html">Home</a>
                <a href="study.html">Study</a>
            </div>
        </nav>
    </header>
    <main>
        <div class="dropdown-container">
            <div class="dropdown">
                <div class="menu">
                    <p>Select Subjects</p>
                    <img src="images/196759-200.png" alt="" aria-label="Toggle subjects list" role="button" tabindex="0">
                </div>
                <div class="checkboxes">
                </div>
            </div>
        </div>
        <div class="container">
            <img src="images/left-arrow-angle-big-gross-symbol.png" alt="" id="back" aria-label="Previous flashcard" role="button" tabindex="0">
            <div class="study-notecard">
                <h1>Select a Subject Above to Start Studying</h1>
            </div>
            <img src="images/right-arrow.png" alt="" id="forward" aria-label="Next flashcard" role="button" tabindex="0">
        </div>
    </main>
</body>
</html>
