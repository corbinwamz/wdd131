<html>
  <head>
    <title>Sorting Activities</title>
    <script src="ponder.js" defer></script>
    <link rel="stylesheet" href="ponder.css">
  </head>
  <body>
    <div class="search">
      <label for="search">Enter Search</label>
      <input id="search" type="text">
      <button>Search</button>
    </div>
    <div id="hike-container">
      <div class="hike-card">
        <div class="hike-content">
          <h2>Teton Canyon</h2>
          <div class="hike-tags">
            <button>Canyon</button>
            <button>Tetons</button>
          </div>
          <p>Beautiful short (or long) hike through Teton Canyon.</p>
          <p>Difficulty: <span class="rating" role="img" aria-label="1 out of 5">🥾▫️▫️▫️▫️</span></p>
        </div>
      </div>
    </div>
  </body>
</html>
